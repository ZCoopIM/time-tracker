<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time Tracker</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Time Tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <!-- Michroma: free stand-in for Eurostile Extended, used only for the timer numerals -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <img class="wordmark" src="assets/im-wordmark.svg" alt="Infinite Machine">
    </header>

    <!-- Step 1: sign in with an Infinite Machine Google account (once per device) -->
    <section id="sign-in-screen" hidden>
      <p class="eyebrow">Time Tracker</p>
      <h1>Sign in with your Infinite Machine account</h1>
      <button id="sign-in" class="btn primary google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <p id="sign-in-status" class="status"></p>
    </section>

    <!-- Step 2: check in / check out -->
    <section id="main-screen" hidden>
      <div class="who">
        <span id="who"></span>
        <button id="sign-out" class="link">Sign out</button>
      </div>

      <!-- Shown after the 7 PM automatic check-out -->
      <div id="notice" hidden>
        <p class="eyebrow">Checked out automatically</p>
        <p id="notice-text"></p>
        <button id="notice-continue" class="btn primary">Continue</button>
        <button id="notice-edit" class="btn">Edit my time</button>
      </div>

      <div id="current" hidden>
        <p class="eyebrow"><span class="dot"></span>Checked in</p>
        <p id="current-activity"></p>
        <p id="current-timer">0:00:00</p>
        <p id="current-since"></p>
        <button id="check-out" class="btn primary">Check out</button>
      </div>

      <p id="prompt" class="eyebrow">Select task</p>
      <div id="activities"></div>

      <form id="other-form" hidden>
        <input id="other-input" placeholder="What are you working on?" required>
        <button class="btn primary" type="submit">Check in</button>
        <button class="btn" type="button" id="other-cancel">Cancel</button>
      </form>

      <!-- Servicing: pick the work order (Service Queue or In Service in Airtable) -->
      <div id="work-order-picker" hidden>
        <p class="eyebrow">Which work order?</p>
        <div id="work-order-list" class="day-list"></div>
        <p id="work-order-status" class="status"></p>
        <button class="btn" type="button" id="work-order-none">Not on the list</button>
        <button class="btn" type="button" id="work-order-cancel">Cancel</button>
      </div>

      <button id="day-open" class="row">
        <span>My day</span><svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
      </button>

      <p id="sync" class="eyebrow"></p>
    </section>

    <!-- What you worked on, and for how long, one day at a time -->
    <section id="day-screen" hidden>
      <div class="who">
        <button id="day-back" class="link">‹ Back</button>
      </div>

      <div class="day-nav">
        <button id="day-prev" aria-label="Previous day"><svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M7 1L1 7l6 6"/></svg></button>
        <p id="day-date"></p>
        <button id="day-next" aria-label="Next day"><svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button>
      </div>

      <div id="day-view">
        <p id="day-total"></p>
        <p class="eyebrow">Total</p>

        <div id="day-tasks-block">
          <p class="eyebrow">By task</p>
          <div id="day-tasks" class="day-list"></div>
          <p class="eyebrow">Timeline · tap to fix a time</p>
          <div id="day-entries" class="day-list"></div>
        </div>

        <button id="day-add" class="btn">+ Add time you forgot to check in</button>
      </div>

      <!-- Fixing a time, or adding a missed one -->
      <form id="edit-form" hidden novalidate>
        <p id="edit-title" class="eyebrow"></p>
        <div id="edit-task-fields">
          <select id="edit-activity" aria-label="Task"></select>
          <input id="edit-note" placeholder="What were you working on?">
          <select id="edit-work-order" aria-label="Work order"></select>
        </div>
        <label class="field"><span>Check in</span><input id="edit-in" type="time"></label>
        <label class="field" id="edit-out-field"><span>Check out</span><input id="edit-out" type="time"></label>
        <p id="edit-error" class="status"></p>
        <button class="btn primary" type="submit">Save</button>
        <button class="btn" type="button" id="edit-cancel">Cancel</button>
      </form>

      <p id="day-status" class="status"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
